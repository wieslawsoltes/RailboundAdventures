name: Living Worlds source snapshot
on:
  push:
    branches: [feat/living-worlds]
    paths: [.github/workflows/living-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive exact repository sources
        run: git archive --format=tar.gz HEAD -o /tmp/living-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: living-source
          path: /tmp/living-source.tar.gz
          retention-days: 7
