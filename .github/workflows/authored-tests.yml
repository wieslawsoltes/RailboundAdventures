name: Art and Motion candidate verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: authored-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check source assets, geometry, history lifetimes and simulation
        run: npm test
      - name: Build complete offline project-scoped candidate
        run: |
          npm run build:pages
          mkdir -p /tmp/art-preview/RailboundAdventures
          cp -a _site/. /tmp/art-preview/RailboundAdventures/
          python -m http.server 8000 --bind 127.0.0.1 --directory /tmp/art-preview >/tmp/art-http.log 2>&1 &
      - name: Install software rendering test environment
        run: |
          python -m pip install playwright==1.62.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers
      - name: Verify authored meshes, station art, temporal rejection and offline delivery
        env:
          BACKEND: ${{ matrix.backend }}
          PAGE_URL: http://127.0.0.1:8000/RailboundAdventures/
        run: xvfb-run -a python -u tools/verify_authored.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authored-${{ matrix.backend }}
          path: authored-results/
          retention-days: 14
          if-no-files-found: error
