name: Refine Living Worlds visual and placement quality
on:
  push:
    branches: [feat/living-worlds]
    paths: [.github/workflows/import-living.yml]
permissions:
  contents: write
concurrency:
  group: import-living
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/living-worlds
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-verified refinements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          sha='d4735cad48ba1607de28e20c4d701737b192fc42'
          request=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=60) as response: blob=json.load(response)
          data=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          payload=lzma.decompress(data)
          assert hashlib.sha256(payload).hexdigest()=='3c12afdf73dce8ef15186a3845f98dc8f0c9318673569ca9130251a9d2c5a49d'
          root=pathlib.Path.cwd().resolve()
          for record in json.loads(payload):
              path=root/record['path']
              assert path.resolve().is_relative_to(root) and '.git' not in path.parts
              raw=path.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==record['base'],'Changed base: '+record['path']
              text=raw.decode('utf-8')
              for start,end,replacement in reversed(record['edits']):
                  assert 0<=start<=end<=len(text)
                  text=text[:start]+replacement+text[end:]
              data=text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==record['sha256']
              path.write_bytes(data);print('Verified',record['path'])
          PY
      - name: Run regressions and regenerate standalone distribution
        run: |
          npm test
          npm run build:pages
      - name: Commit tested refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests tools docs dist
          git diff --cached --check
          git commit -m 'fix: refine foliage silhouettes, coherent city placement and ecology budgets' -m 'Distribute capped canopy sites across the whole map; reduce cell submission overhead; reserve roads across districts; refine small leaflets, stable facade seeds and flat material interpolation; add stepped towers and shared sedan/estate geometry; scale corridor understory with ecological density; validate terrain clearance in close-up visual tests.'
          git push origin HEAD:feat/living-worlds
