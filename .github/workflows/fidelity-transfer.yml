name: Fidelity source transfer
on:
  push:
    branches: [feat/material-lighting-fidelity]
    paths: [.github/workflows/fidelity-transfer.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive source
        run: git archive --format=tar.gz --output=fidelity-baseline.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: fidelity-baseline
          path: fidelity-baseline.tar.gz
          retention-days: 7
