name: Fidelity source transfer
on:
  push:
    branches: [feat/material-lighting-fidelity]
    paths: [.github/workflows/fidelity-transfer.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/material-lighting-fidelity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-verified visual refinements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          sha='a309907115b8af2be6097cba81f912dfb222d2b5'
          request=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=60) as response:
              data=base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          payload=lzma.decompress(data)
          assert hashlib.sha256(payload).hexdigest()=='e5665364774d16067327692a1e60665d2b494abaab6d44fd2e211aa32d054c61'
          root=pathlib.Path.cwd().resolve()
          for record in json.loads(payload):
              path=root/record['path']
              assert path.resolve().is_relative_to(root) and not set(path.parts)&{'.git','.github'}
              if 'text' in record:
                  text=record['text']
              else:
                  raw=path.read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==record['base'],record['path']
                  text=raw.decode()
                  for start,end,replacement in reversed(record['edits']):
                      assert 0<=start<=end<=len(text)
                      text=text[:start]+replacement+text[end:]
              target=text.encode()
              assert hashlib.sha256(target).hexdigest()==record['sha256'],record['path']
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(target)
              print('Verified',record['path'],len(target))
          PY
      - name: Test and rebuild
        run: |
          npm test
          npm run build:pages
      - name: Commit verified source and distribution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs dist
          git diff --cached --check
          git commit -m 'fix: natural surface repetition, biome tint and grazing-angle stability'
          git push origin HEAD:feat/material-lighting-fidelity
