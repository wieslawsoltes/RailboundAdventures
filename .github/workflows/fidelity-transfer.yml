name: Fidelity source transfer
on:
  push:
    branches: [feat/material-lighting-fidelity]
    paths: [.github/workflows/fidelity-transfer.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/material-lighting-fidelity
      - name: Prepare licensed material library
        run: |
          python -m pip install pillow==11.3.0
          python tools/acquire_materials.py
      - name: Commit only material assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/materials
          git diff --cached --check
          git commit -m 'assets: bundle eight CC0 surface materials and source hashes'
          git push origin HEAD:feat/material-lighting-fidelity
      - name: Archive prepared source
        run: git archive --format=tar.gz --output=fidelity-assets.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: fidelity-assets
          path: fidelity-assets.tar.gz
          retention-days: 7
