name: Build curated art assets
on:
  push:
    branches: [feat/authored-worlds-temporal]
    paths: [.github/workflows/art-asset-build.yml]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/authored-worlds-temporal
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Acquire licensed inputs and pinned offline simplifier
        run: |
          python -m pip install numpy==2.3.5 pillow==12.3.0
          python tools/acquire_authored.py /tmp/railbound-art
          npm pack meshoptimizer@1.2.0 --pack-destination /tmp
          echo '33cbc8461420e2e8fac055be41d19e7a8c2e0322527690e3165e327758e86187  /tmp/meshoptimizer-1.2.0.tgz' | sha256sum -c -
          mkdir -p /tmp/meshopt
          tar -xzf /tmp/meshoptimizer-1.2.0.tgz -C /tmp/meshopt
      - name: Convert source geometry and pack derived data
        run: |
          python tools/prepare_authored.py /tmp/railbound-art /tmp/railbound-converted
          node tools/simplify_authored.mjs /tmp/railbound-converted /tmp/meshopt/package
          python tools/prepare_authored.py --pack /tmp/railbound-converted assets/authored
      - name: Commit generated assets only
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add assets/authored
          if ! git diff --cached --quiet; then
            git commit -m 'assets: bundle converted CC0 natural meshes, opacity and surface maps'
            git pull --rebase origin feat/authored-worlds-temporal
            git push origin HEAD:feat/authored-worlds-temporal
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: converted-art-assets
          path: assets/authored/
          retention-days: 14
