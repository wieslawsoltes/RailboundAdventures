name: Art review source snapshot
on:
  push:
    branches: [feat/authored-worlds-temporal]
    paths: [.github/workflows/art-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive committed source without executing it
        run: |
          mkdir -p review-source
          git archive --format=tar.gz --output=review-source/source.tar.gz HEAD
          git rev-parse HEAD > review-source/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: attached-art-source
          path: review-source/
          retention-days: 7
