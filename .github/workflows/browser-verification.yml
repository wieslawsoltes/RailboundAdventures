name: Browser runtime verification

on:
  workflow_run:
    workflows: [Test and deploy GitHub Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser and software Vulkan dependencies
        run: |
          python -m pip install playwright==1.62.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Verify live rendering, driving, mobile controls and offline startup
        env:
          PAGE_URL: https://wieslawsoltes.github.io/RailboundAdventures/
          BACKEND: ${{ matrix.backend }}
        run: xvfb-run -a -s '-screen 0 1600x1200x24' python -u tools/verify_browser.py
      - name: Preserve screenshots and machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ matrix.backend }}
          path: browser-results/
          if-no-files-found: ignore
          retention-days: 14
