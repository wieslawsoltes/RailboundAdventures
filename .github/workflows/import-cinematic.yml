name: Finish cinematic terrain clearance
on:
  push:
    branches: [feat/cinematic-journeys]
    paths: [.github/workflows/import-cinematic.yml]
permissions:
  contents: write
concurrency:
  group: import-cinematic
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/cinematic-journeys
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-verified visual corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          sha='d9f3e4f64be370bdcdded74654e39f963c801b72'
          req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=60) as response: blob=json.load(response)
          raw=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
          payload=lzma.decompress(raw)
          assert hashlib.sha256(payload).hexdigest()=='7933e56816be6f616db95dd6b0c88dd8e06f55987b78b03f67588ac5a5b9928e'
          root=pathlib.Path.cwd().resolve()
          for record in json.loads(payload):
              path=root/record['path']
              assert path.resolve().is_relative_to(root) and '.git' not in path.parts and '.github' not in path.parts
              if 'text' in record:
                  assert not path.exists()
                  text=record['text']
              else:
                  raw=path.read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==record['base'],record['path']
                  text=raw.decode()
                  for start,end,replacement in reversed(record['edits']):
                      assert 0<=start<=end<=len(text)
                      text=text[:start]+replacement+text[end:]
              raw=text.encode()
              assert hashlib.sha256(raw).hexdigest()==record['sha256'],record['path']
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(raw)
              print('Verified',record['path'])
          PY
      - name: Run all regressions and regenerate distributions
        run: |
          npm test
          npm run build:pages
      - name: Commit tested corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests tools docs sw.js dist
          git diff --cached --check
          git commit -m 'fix: conform terrain triangles to railway cuttings and keep cameras above rendered ground' -m 'Add track-adjacent adaptive tessellation with conforming shared edges, direct near-mesh height queries, non-collapsing camera boom clearance and loading-gauge regressions. Match high-speed cab framing to its loft, close the nose cap and constrain roof equipment behind the taper.'
          git push origin HEAD:feat/cinematic-journeys
