name: Authored conversion prerequisites
on:
  push:
    branches: [feat/authored-worlds-temporal]
    paths: [.github/workflows/art-extras.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Acquire explicit foliage opacity and provenance metadata
        run: |
          mkdir -p extras
          python3 - <<'PY'
          import urllib.request,json,pathlib,hashlib
          root=pathlib.Path('extras');headers={'User-Agent':'RailboundAdventures-AuthoredAssets/1.0','Referer':'https://github.com/wieslawsoltes/RailboundAdventures'}
          def get(url):
              assert url.startswith(('https://api.polyhaven.com/','https://dl.polyhaven.org/'))
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:return r.read(20000000)
          meta=json.loads(get('https://api.polyhaven.com/files/fern_02'));record=meta['Alpha']['1k']['png'];raw=get(record['url']);assert hashlib.md5(raw).hexdigest()==record['md5']
          (root/'fern-alpha.png').write_bytes(raw)
          (root/'fern-alpha-source.json').write_text(json.dumps({'url':record['url'],'sha256':hashlib.sha256(raw).hexdigest()}))
          for asset in ['rock_moss_set_01','tree_stump_02','fern_02','pine_tree_01']:
              (root/(asset+'-info.json')).write_bytes(get('https://api.polyhaven.com/info/'+asset))
          PY
      - name: Pin build-time simplifier (not a runtime dependency)
        run: npm pack meshoptimizer@1.2.0 --pack-destination extras
      - uses: actions/upload-artifact@v4
        with:
          name: authored-conversion-extras
          path: extras/
          retention-days: 7
