name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run simulation and core tests
        run: npm test
      - name: Build and validate project-relative runtime assets
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Rebuild reference artifact for byte-for-byte verification
        run: python3 tools/build_pages.py
      - name: Verify the published revision and all public assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tools/verify_deployment.py
      - name: Preserve deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification
          path: deployment-verification.json
          if-no-files-found: ignore
