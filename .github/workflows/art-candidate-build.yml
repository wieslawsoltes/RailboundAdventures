name: Art candidate build and browser checks
on:
  push:
    branches: [feat/authored-worlds-temporal]
    paths: [.github/workflows/art-candidate-build.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/authored-worlds-temporal
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test committed source and regenerate distribution
        run: |
          npm test
          npm run build:pages
          python -m py_compile tools/verify_authored.py
      - name: Commit generated distribution only
        id: commit
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate complete Art and Motion standalone distribution'
            git pull --rebase origin feat/authored-worlds-temporal
            git push origin HEAD:feat/authored-worlds-temporal
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Archive exact build for review
        run: |
          mkdir -p review
          git archive --format=tar.gz --output=review/source.tar.gz HEAD
          cp _site/deployment-manifest.json review/ || true
          git rev-parse HEAD > review/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: art-candidate-source
          path: review/
          retention-days: 14
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build candidate and install browser
        run: |
          npm run build:pages
          python -m pip install playwright==1.62.0 pillow==12.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers
      - name: Verify real art and temporal output
        env:
          BACKEND: ${{ matrix.backend }}
          PAGE_URL: http://127.0.0.1:8000/RailboundAdventures/
        run: |
          mkdir -p /tmp/art-preview/RailboundAdventures
          cp -a _site/. /tmp/art-preview/RailboundAdventures/
          python -m http.server 8000 --bind 127.0.0.1 --directory /tmp/art-preview >/tmp/art-http.log 2>&1 &
          xvfb-run -a python -u tools/verify_authored.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-review-${{ matrix.backend }}
          path: authored-results/
          retention-days: 14
          if-no-files-found: error
