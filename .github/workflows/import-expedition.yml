name: Finish Expedition route safety
on:
  push:
    branches: [feat/expedition-worlds-detailed-trains]
    paths: [.github/workflows/import-expedition.yml]
permissions:
  contents: write
concurrency:
  group: import-expedition
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/expedition-worlds-detailed-trains
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Limit parallel route excursion by sampled curvature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/tracks.js')
          s=p.read_text()
          old='   branch.length=0;\n   for(let j=a;j<=b;j++)'
          new='''   branch.length=0;
             // Parallel offsets have a cusp when offset * curvature approaches one.
             // Bound the entire excursion using sampled horizontal curvature, retaining
             // a smooth sin-squared envelope rather than introducing local kinks.
             let maxCurvature=0;
             for(let j=a+1;j<b;j++) {
              const p=all[j-1],q=all[j],r=all[j+1];
              const ux=q[0]-p[0],uz=q[2]-p[2],vx=r[0]-q[0],vz=r[2]-q[2];
              const lu=Math.hypot(ux,uz),lv=Math.hypot(vx,vz);
              if(lu>1e-6&&lv>1e-6)maxCurvature=Math.max(maxCurvature,Math.hypot(vx/lv-ux/lu,vz/lv-uz/lu)/((lu+lv)*.5));
             }
             const excursion=Math.min(world.theme==='canyon'?200:130,.2/Math.max(1e-9,maxCurvature));
             for(let j=a;j<=b;j++)'''
          assert old in s
          s=s.replace(old,new).replace("Math.sin(Math.PI*t)**2*(world.theme==='canyon'?200:130)","Math.sin(Math.PI*t)**2*excursion")
          p.write_text(s)
          d=Path('docs/EXPEDITIONS.md')
          d.write_text(d.read_text()+'\n### Extreme-seed route safety\n\nParallel-route displacement is limited by the maximum sampled horizontal curvature: excursion times curvature stays at or below 0.2. This prevents offset cusps and folded branch tangents. Eight additional regressions cover all track segments in 24 region/seed combinations at maximum relief and erosion, including coastal seed 1. This is a tested seed set, not a proof for every possible seed.\n')
          PY
      - name: Run all core and extreme-seed regressions
        run: npm test
      - name: Build and validate complete distribution
        run: npm run build:pages
      - name: Commit tested source and regenerated standalone game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tracks.js docs/EXPEDITIONS.md dist
          git diff --cached --check
          git commit -m 'fix: constrain branch offsets by curvature and rebuild Expedition distribution'
          git push origin HEAD:feat/expedition-worlds-detailed-trains
