name: Finalize fidelity startup regression
on:
  push:
    branches: [feat/material-lighting-fidelity]
    paths: [.github/workflows/release-snapshot.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/material-lighting-fidelity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Give every compatibility context an explicit bounded startup deadline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/verify_cinematic.py');s=p.read_text()
          old='page.wait_for_function(\'document.getElementById("loading").classList.contains("hidden")\')'
          new='page.wait_for_function(\'document.getElementById("loading").classList.contains("hidden")\', timeout=120000, polling=100)'
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            context2=browser.new_context(viewport={'width':900,'height':600})"
          assert s.count(old)==1
          s=s.replace(old,old+'\n            context2.set_default_timeout(120000)')
          p.write_text(s)
          PY
      - name: Check Python and all core regressions
        run: |
          python3 -m py_compile tools/verify_cinematic.py
          npm test
      - name: Commit regression harness correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify_cinematic.py
          git diff --cached --check
          git commit -m 'test: bound LDR compatibility startup consistently on software GPUs'
          git push origin HEAD:feat/material-lighting-fidelity
