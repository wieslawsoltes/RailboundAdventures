name: Import original Railbound Adventures source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/import.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: railbound-source-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore checksum-verified source archive
        run: python3 .bootstrap/restore.py
      - name: Regenerate application icons from the original vector asset
        timeout-minutes: 3
        run: |
          python3 -m pip install --disable-pip-version-check --timeout 15 --retries 2 cairosvg
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          source = Path('assets/icon.svg').read_bytes()
          for size in (180, 192, 512):
              cairosvg.svg2png(bytestring=source, write_to=f'assets/icon-{size}.png', output_width=size, output_height=size)
          PY
      - name: Run core tests and build the Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee tests/core-test-results.txt
          npm run build:pages
      - name: Distinguish development graphics results from CI validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          p.write_text(p.read_text().replace('![Railbound Adventures desktop gameplay](docs/preview-desktop.png)\n',''))
          p=Path('docs/TESTING.md')
          p.write_text(p.read_text()+'\n## GitHub import validation\n\nThe GitHub import reran the core tests and Pages artifact validation. The 61 browser checks above and `tests/browser-integration-report.json` record the original development session, not a new CI graphics pass. Earlier CI graphics attempts could not initialize WebGPU or WebGL 2. Renderer certification remains separate from static deployment validation; native WebGPU and physical mobile devices remain unverified.\n')
          PY
      - name: Commit complete editable source and generated distributions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .bootstrap
          git add --all
          git diff --cached --stat
          git commit -m 'Import Railbound Adventures simulator, source, assets, tests and documentation'
          git push origin HEAD:main
          echo "Imported source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve core validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-import-validation
          path: tests/core-test-results.txt
          if-no-files-found: ignore
