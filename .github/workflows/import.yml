name: Import original Railbound Adventures source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/import.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: railbound-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore checksum-verified source archive
        run: python3 .bootstrap/restore.py
      - name: Install asset-generation and browser-test tools
        run: |
          python3 -m pip install --disable-pip-version-check cairosvg playwright
          python3 -m playwright install --with-deps chromium
      - name: Regenerate application icons from the original vector asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          source = Path('assets/icon.svg').read_bytes()
          for size in (180, 192, 512):
              cairosvg.svg2png(bytestring=source, write_to=f'assets/icon-{size}.png', output_width=size, output_height=size)
          PY
      - name: Run core tests and build the Pages artifact
        id: core
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee tests/core-test-results.txt
          npm run build:pages
      - name: Run browser integration tests and generate previews
        id: browser
        timeout-minutes: 15
        env:
          RAILBOUND_HEADFUL: '1'
        run: |
          xvfb-run -a python3 tools/integration_browser.py
          cp ../Railbound-Desktop.png docs/preview-desktop.png
          cp ../Railbound-Mobile.png docs/preview-mobile.png
      - name: Commit editable source, distributions and actual validation reports
        if: always() && steps.core.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f docs/preview-desktop.png ]; then
            python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          p.write_text(p.read_text().replace('![Railbound Adventures desktop gameplay](docs/preview-desktop.png)\n',''))
          p=Path('docs/TESTING.md')
          p.write_text(p.read_text()+'\n## GitHub import validation\n\nThe physics tests and Pages artifact validation passed. The graphics runner could not initialize a renderer; see `tests/browser-integration-report.json` and the import workflow logs. The earlier 61-check result above describes the original development session, not this CI run. Native WebGPU and physical mobile devices remain unverified.\n')
          PY
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .bootstrap
          git add --all
          git diff --cached --stat
          git commit -m 'Import Railbound Adventures simulator, source, assets, tests and documentation'
          git push origin HEAD:main
          echo "Imported source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-import-validation
          path: |
            tests/*report.json
            tests/core-test-results.txt
          if-no-files-found: ignore
