name: Living Worlds candidate verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: living-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test simulation, geometry, ecology and city constraints
        run: npm test
      - name: Build project-relative candidate
        run: |
          npm run build:pages
          mkdir -p /tmp/railbound-preview/RailboundAdventures
          cp -a _site/. /tmp/railbound-preview/RailboundAdventures/
          python -m http.server 8000 --bind 127.0.0.1 --directory /tmp/railbound-preview > /tmp/living-http.log 2>&1 &
      - name: Install browser and software GPU
        run: |
          python -m pip install playwright==1.62.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers
      - name: Inspect Living Worlds rendering and interactions
        env:
          PAGE_URL: http://127.0.0.1:8000/RailboundAdventures/
          BACKEND: ${{ matrix.backend }}
        run: xvfb-run -a python -u tools/verify_living.py
      - name: Keep visual evidence and standalone build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-${{ matrix.backend }}
          path: |
            living-results/
            dist/index.html
          if-no-files-found: error
          retention-days: 14
